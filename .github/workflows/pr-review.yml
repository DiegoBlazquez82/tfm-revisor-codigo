name: Revisión del PR con agentes

# pull_request_target: el workflow y el código del revisor se toman de la rama BASE del
# repositorio (ya revisada y fusionada), no de la rama del PR. Así un PR no puede cambiar
# el revisor, ni este workflow, para ejecutar código en el runner propio.
# NUNCA se hace checkout de la rama del PR en este job: el PR solo se lee como texto (su diff)
# a través de la API de GitHub.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# Permisos mínimos: leer el código y comentar en el PR.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Solo PRs del propio repositorio. Los de forks no se revisan automáticamente: el texto del
    # PR es entrada de un tercero que acaba en el prompt del modelo (ver docs/amenazas.md).
    if: github.event.pull_request.head.repo.full_name == github.repository
    # Runner propio con Ollama instalado (etiqueta "ollama").
    runs-on: [self-hosted, ollama]
    timeout-minutes: 15
    steps:
      # Sin `ref`: en pull_request_target esto descarga la rama base, no la del PR.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Revisar y comentar
        run: >
          uv run revisor review
          --repo "${{ github.repository }}"
          --pr "${{ github.event.pull_request.number }}"
          --post
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL || 'http://localhost:11434' }}
          OLLAMA_MODEL: qwen2.5:7b-instruct
